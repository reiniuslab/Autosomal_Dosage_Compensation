project: clonal_xpress_1
sequence_files:
  file1:
    name: /fastq/xpress/1/V350199491_V350199585.read1.fastq.gz
    base_definition:
      - cDNA(25-150)
      - UMI(12-21)
    find_pattern: ATTGCGCAATG;2
  file2:
    name: /fastq/xpress/1/V350199491_V350199585.read2.fastq.gz
    base_definition:
      - cDNA(1-150)
      - BC(151-170)
reference:
  STAR_index: /genome_index/star/GRCm38.p6.mgp.CAST_EiJ_N-masked.noGTF
  GTF_file: /GRCm38.mgp/Mus_musculus.GRCm38.97.chr.gtf
  additional_STAR_params: '--limitSjdbInsertNsj 2000000 --clip3pAdapterSeq CTGTCTCTTATACACATCT'
  additional_files: /molecularSpikes_complexset_5p.fa
out_dir: /out_mRNA/clonal_xpress_1
num_threads: 100
mem_limit: 0
filter_cutoffs:
  BC_filter:
    num_bases: 1
    phred: 20
  UMI_filter:
    num_bases: 1
    phred: 20
barcodes:
  barcode_num: ~
  barcode_file: /expected_barcodes_clonal_xpress_1.txt
  automatic: no
  BarcodeBinning: 1
  demultiplex: no
  nReadsperCell: 100
  discardReads: yes
counting_opts:
  introns: yes
  downsampling: '100000'
  strand: 1
  Ham_Dist: 1
  velocyto: no
  primaryHit: yes
  twoPass: no
make_stats: yes
which_Stage: Filtering
samtools_exec: samtools
pigz_exec: pigz
STAR_exec: STAR
Rscript_exec: Rscript
read_layout: PE
zUMIs_directory: /zUMIs/
